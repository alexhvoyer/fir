name: Fir
options:
  bundleIdPrefix: dev.khvoynitsky
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 28MK6UC4T4
    CODE_SIGN_STYLE: Automatic
    # Interface strings go to each target's Localizable.xcstrings; translations are added there.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  MozillaRustComponents:
    path: Packages/MozillaRustComponents
  # Mozilla's components need it; listed so the app can embed it. Move with Packages/MozillaRustComponents.
  Glean:
    url: https://github.com/mozilla/glean-swift
    exactVersion: 70.3.0
targets:
  Fir:
    type: application
    platform: iOS
    # Declared schemes for every target: once one is shared, Xcode stops making the others.
    scheme: {}
    sources:
      - Fir
      - Shared
    dependencies:
      - target: FirMozilla
      - package: Glean
        product: Glean
      - target: FirWidget
      - target: FirShare
    entitlements:
      path: Fir/Fir.entitlements
      properties:
        # New files can't be opened while the phone is locked. Not "complete": saving must still work while page audio plays.
        com.apple.developer.default-data-protection: NSFileProtectionCompleteUnlessOpen
        # Granted by Apple on request; lets Fir be chosen as the default browser.
        com.apple.developer.web-browser: true
    info:
      path: Fir/Info.plist
      properties:
        # Without it iOS caps the app's animations at 60 Hz on ProMotion iPhones; Safari runs at 120.
        CADisableMinimumFrameDurationOnPhone: true
        # A browser opens any site; without this iOS refuses plain HTTP pages outright. HTTPS-Only decides instead.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.khvoynitsky.browser
            CFBundleURLSchemes: [firbrowser]
          # Required to be offered as the default browser.
          - CFBundleURLName: Web Link
            CFBundleURLSchemes: [http, https]
        # Download progress on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # Lets Spotlight hand a typed query over to the app; SystemSearch runs it.
        CoreSpotlightContinuation: true
        # Long-press actions on the home screen icon; QuickAction handles them.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: NewTab
            UIApplicationShortcutItemTitle: New Tab
            UIApplicationShortcutItemIconSymbolName: plus
          - UIApplicationShortcutItemType: NewPrivateTab
            UIApplicationShortcutItemTitle: New Private Tab
            UIApplicationShortcutItemIconSymbolName: eyes
        # Downloads live in Documents/Downloads; these show the folder in the Files app.
        UIFileSharingEnabled: true
        # Keeps page audio playing with the screen off and lets video continue in picture in picture.
        UIBackgroundModes: [audio]
        LSSupportsOpeningDocumentsInPlace: true
        # One window: two would share one browser and its web views, and the lock covers only one window.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The heading typeface (OFL, see Shared/Fonts).
        UIAppFonts: [BricolageGrotesque.ttf]
        # Standard algorithms only (NSS in the Rust components) and no France, so App Store Connect
        # needs no documentation. Distributing in France would require a French declaration first.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.khvoynitsky.browser
        # The simulator can't reopen "complete unless open" files: tabs and history were lost on every launch.
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Chosen in Settings > Appearance.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Night AppIcon-Spruce"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Every turn of an iPad: required for Split View and Stage Manager.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: Fir
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock Fir when the app lock is on.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save images from websites to your photo library.
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos for websites, and use the camera on sites you allow.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record video for websites, and use the microphone on sites you allow.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your speech into text on sites you allow.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  # Unit tests for code that parses untrusted input. It compiles those files directly, so no app host is needed.
  FirTests:
    type: bundle.unit-test
    platform: iOS
    scheme:
      testTargets: [FirTests]
    sources:
      - FirTests
      - Fir/ZipExtractor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.khvoynitsky.browser.Tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  # The automated Smoke of docs/regression-checklist.md. scripts/ui-tests.sh runs it on an erased simulator of its own.
  FirUITests:
    type: bundle.ui-testing
    platform: iOS
    scheme:
      testTargets: [FirUITests]
    sources:
      - FirUITests
    dependencies:
      - target: Fir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.khvoynitsky.browser.UITests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Fir
        TARGETED_DEVICE_FAMILY: "1,2"
  FirWidget:
    type: app-extension
    platform: iOS
    scheme: {}
    sources:
      - FirWidget
      - Shared
    info:
      path: FirWidget/Info.plist
      properties:
        CFBundleDisplayName: Fir
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.khvoynitsky.browser.Widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  # Fir in the system share sheet: Open in Fir, and Send to Device with the app's Mozilla sign-in.
  FirShare:
    type: app-extension
    platform: iOS
    scheme: {}
    sources:
      - FirShare
      - Shared/MozillaAccount.swift
      - Shared/OpenInFir.swift
    dependencies:
      # The app embeds the frameworks; an extension carrying its own copies is rejected on upload.
      - target: FirMozilla
        embed: false
    entitlements:
      path: FirShare/FirShare.entitlements
      properties:
        # The app's own group: its Mozilla sign-in is stored there, so nothing has to move.
        keychain-access-groups: [$(AppIdentifierPrefix)dev.khvoynitsky.browser]
    info:
      path: FirShare/Info.plist
      properties:
        CFBundleDisplayName: Fir
        FirKeychainGroup: $(AppIdentifierPrefix)dev.khvoynitsky.browser
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              # Messengers often share a link as text.
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.khvoynitsky.browser.Share
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  # Mozilla's components as one dynamic framework, shared by the app and its share extension.
  FirMozilla:
    type: framework
    platform: iOS
    sources:
      - FirMozilla
    dependencies:
      - package: MozillaRustComponents
        product: MozillaRustComponents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.khvoynitsky.browser.Mozilla
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Linked by the share extension.
        APPLICATION_EXTENSION_API_ONLY: YES
